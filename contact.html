<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | JAMMPIT SOLTECH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">JAMMPIT SOLTECH</div>
        <nav><a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a></nav>
    </header>

    <div class="container" style="text-align: center;">
        <h1 style="font-family: 'Montserrat';">Get In Touch</h1>
        <p>Ready to enhance your digital operations? Fill out the form below.</p>
        
        <form style="margin: 40px auto; text-align: left; background: #fcfcfc; padding: 30px; border-radius: 15px; border: 1px solid #eee;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label>First Name</label>
                    <input type="text" placeholder="First Name" style="width: 100%;">
                </div>
                <div>
                    <label>Last Name</label>
                    <input type="text" placeholder="Last Name" style="width: 100%;">
                </div>
            </div>
            
            <label style="display: block; margin-top: 20px;">Email Address</label>
            <input type="email" placeholder="email@example.com" style="width: 100%;">
            
            <label style="display: block; margin-top: 20px;">How can we help?</label>
            <textarea rows="5" style="width: 100%; border-radius: 6px; border: 1px solid #ccc;"></textarea>
            
            <button type="submit" style="width: 100%; margin-top: 20px; font-weight: bold;">SEND MESSAGE</button>
        </form>
    </div>
    <footer>
        <div class="footer-container">
            <nav class="footer-nav">
                <a href="index.html">Home</a>
